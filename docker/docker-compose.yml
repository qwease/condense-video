# Docker Compose 配置
# 完整的视频浓缩服务：API + Celery Worker + Redis + MinIO

services:
  # ============== Redis ==============
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - condense-video-network
    restart: unless-stopped

  # ============== MinIO (对象存储) ==============
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - condense-video-network
    restart: unless-stopped

  # ============== FastAPI 服务 ==============
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "58000:8000"
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - condense-video-network
    restart: unless-stopped

  # ============== Celery Worker ==============
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file:
      - ../.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - /tmp/ffmpeg:/tmp/ffmpeg
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-2} --pool=solo
    healthcheck:
      test: [ "CMD", "celery", "-A", "tasks.celery_app", "inspect", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - condense-video-network
    restart: unless-stopped

  # ============== Flower (Celery 监控面板) ==============
  flower:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FLOWER_UNAUTHENTICATED_API=true
    depends_on:
      - redis
      - worker
    command: celery -A tasks.celery_app flower --port=5555 --broker=redis://redis:6379/0
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5555" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - condense-video-network
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:


networks:
  condense-video-network:
    driver: bridge
